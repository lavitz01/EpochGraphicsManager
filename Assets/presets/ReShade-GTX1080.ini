; Lightweight preset for GTX 1080 — SMAA + FakeHDR only.
; Effect parameters match Lumenveil extras/reshade/ReShade-Lumenveil.ini (v0.1.1).
; MXAO / Vibrance / Curves omitted for frame-time headroom (Lumenveil docs note MXAO is the costliest effect).
; Requires SweetFX by CeeJay.dk and iMMERSE by Marty McFly effect packages from ReShade setup.
; Depth preprocessor definitions (if using depth-aware SMAA edges):
;   RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=150.0
;   RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0
;   RESHADE_DEPTH_INPUT_IS_REVERSED=0
;   RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0

Techniques=MartysMods_AntiAliasing@MartysMods_SMAA.fx,HDR@FakeHDR.fx
TechniqueSorting=MartysMods_AntiAliasing_Prepass@MartysMods_SMAA.fx,MartysMods_AntiAliasing@MartysMods_SMAA.fx,HDR@FakeHDR.fx

[FakeHDR.fx]
HDRPower=1.518000
radius1=0.793000
radius2=0.870000

[MartysMods_SMAA.fx]
DebugOutput=0
EDGE_DETECTION_MODE=3
SMAA_CORNER_ROUNDING=25
SMAA_DEPTH_THRESHOLD=0.010000
SMAA_MAX_SEARCH_STEPS=32
SMAA_MAX_SEARCH_STEPS_DIAG=16
SMAA_PREDICATION=0
SMAA_PREDICATION_SCALE=2.000000
SMAA_PREDICATION_STRENGTH=0.400000
SMAA_PREDICATION_THRESHOLD=0.010000
SMAA_THRESHOLD=0.100000
